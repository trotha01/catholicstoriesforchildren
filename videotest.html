<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Playback Test</title>
</head>

<body>
    <!-- Update the src to point to your actual video file -->
    <!-- <video id="video" src="path/to/your/video.mp4" muted playsinline autoplay controls -->
    <video id="video" src="/assets/ThereseSingAlongIG.mp4" preload="auto" muted playsinline autoplay controls loop
        crossorigin="anonymous" style="width: 100%; max-width: 600px;">
        Your browser does not support the video tag.
    </video>

    <script>
        // Unlock playback on first user interaction (iOS Safari requirement)
        document.body.addEventListener('click', function unlock() {
            var video = document.getElementById('video');
            video.play().then(function () {
                video.pause();
            }).catch(function (e) {
                console.error('Video unlock failed:', e);
            });
            document.body.removeEventListener('click', unlock);
        }, { once: true });
    </script>
</body>

</html>
