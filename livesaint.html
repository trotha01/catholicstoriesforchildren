<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AR.js Video Overlay</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.min.js"></script>
    <!-- Marker Generater: https://ar-js-org.github.io/NFT-Marker-Creator -->
    <!-- Generate Marker: https://carnaux.github.io/NFT-Marker-Creator/#/ -->
    <!-- Note: marker must be a square -->
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        <a-nft type="nft" url="/assets/AR/ARTest" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">
            <a-box position="0 0.5 0" rotation="0 45 0" scale="0.5 0.5 0.5" material="color: red;">
            </a-box>
        </a-nft>

        <a-entity light="type: ambient; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; intensity: 0.7" position="0 1 1"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.querySelector('a-nft');
        marker.addEventListener('markerFound', () => console.log('✅ markerFound'));
        marker.addEventListener('markerLost', () => console.log('❌ markerLost'));
    </script>
</body>

</html>
