<html>

<head>
    <meta charset="utf-8">
    <title>AR Saint Therese of Lisieux</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta aframe-injected="" name="mobile-web-app-capable" content="yes">
    <meta aframe-injected="" name="theme-color" content="black">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
        AFRAME.registerComponent('mytarget', {
            init: function () {
                const video1 = document.querySelector("#video-mp4");
                const video2 = document.querySelector("#video-webm");
                this.el.addEventListener('targetFound', event => {
                    console.log("target found");

                    const previewButton = document.querySelector("#preview-button");
                    previewButton.addEventListener('click', () => {
                        previewButton.setAttribute("visible", false);
                        const testVideo = document.createElement("video");
                        const canplayWebm = testVideo.canPlayType('video/webm; codecs="vp8, vorbis"');
                        if (canplayWebm == "") {
                            document.querySelector("#video-link").setAttribute("src", "#video-mp4");
                            video1.play();
                        } else {
                            document.querySelector("#video-link").setAttribute("src", "#video-webm");
                            video2.play();
                        }
                    });
                });
                this.el.addEventListener('targetLost', event => {
                    console.log("target lost");
                    video1.pause();
                    video2.pause();

                });
            }
        });
    </script>
</head>

<body>
    <div class="example-container">

        <a-scene
            mindar-image="imageTargetSrc: ./assets/AR/therese.mind; showStats: false; uiScanning: #example-scanning-overlay; filterMinCF:0.1; filterBeta: 10; warmupTolerance: 1; missTolerance: 1;"
            embedded="" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" inspector=""
            keyboard-shortcuts="" screenshot="">
            <a-assets timeout="20000">
                <img id="preview" src="/assets/AR/Therese.png">
                <video id="video-mp4" autoplay="false" loop="true" src="/assets/AR/ThereseSingAlong.mp4" playsinline=""
                    webkit-playsinline=""></video>
                <video id="video-webm" autoplay="false" loop="true" src="/assets/AR/ThereseSingAlong.webm"
                    playsinline="" webkit-playsinline=""></video>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
                raycaster="far: 10000; objects: .clickable" camera="" rotation="" wasd-controls="">
            </a-camera>

            <a-entity id="mytarget" mytarget="" mindar-image-target="targetIndex: 0">
                <a-video id="video-link" webkit-playsinline="" playsinline="" width="1" height="1.77" position="0 0 0"
                    material="" geometry=""></a-video>
                <a-image id="preview-button" class="clickable" src="#preview" alpha-test="0.5" position="0 0 0"
                    height="1.77" width="1" material="" geometry="">
                </a-image>
            </a-entity>

            <canvas class="a-canvas" data-aframe-canvas="true" data-engine="three.js r147" width="1920"
                height="1670"></canvas>

            <div class="a-loader-title" style="display: none;"></div><a-entity light="" data-aframe-default-light=""
                aframe-injected=""></a-entity><a-entity light="" position="" data-aframe-default-light=""
                aframe-injected=""></a-entity>
        </a-scene>

        <video autoplay="" muted="" playsinline=""
            style="position: absolute; top: 0px; left: -85.8333px; z-index: -2; width: 1250.67px; height: 938px;"
            width="640" height="480"></video>
    </div>


    <div class="mindar-ui-overlay mindar-ui-loading hidden">
        <div class="loader">
        </div>
    </div>
    <div class="mindar-ui-overlay mindar-ui-compatibility hidden">
        <div class="content">
            <h1>Failed to launch :(</h1>
            <p>
                Looks like your device/browser is not compatible.
            </p>

            <br>
            <br>
            <p>
                Please try the following recommended browsers:
            </p>
            <p>
                For Android device - Chrome
            </p>
            <p>
                For iOS device - Safari
            </p>
        </div>
    </div>
</body>

</html>
