  <!-- Lazy load Substack iframes when they are near viewport or after a delay -->
  <script>
  (function(){
    const SEL = '[data-substack-src]';

    function inject(el){
      if (!el || el.__loaded) return;
      el.__loaded = true;

      var src = el.getAttribute('data-substack-src');
      var h   = el.getAttribute('data-height') || '220';

      var iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.title = 'Substack Signup';
      iframe.loading = 'lazy';
      iframe.referrerPolicy = 'no-referrer-when-downgrade';
      iframe.sandbox = 'allow-forms allow-scripts allow-popups allow-top-navigation-by-user-activation allow-same-origin';
      iframe.style.width = '100%';
      iframe.style.height = h + 'px';
      iframe.style.background = 'transparent';
      iframe.className = 'rounded';

      // IMPORTANT: never replace Elm-owned nodes; mutate children or existing iframe only.
      var tag = (el.tagName || '').toLowerCase();
      if (tag === 'iframe') {
        // Placeholder is already an iframe rendered by Elm; just set its src.
        el.src = src;
        el.title = 'Substack Signup';
        el.loading = 'lazy';
        el.referrerPolicy = 'no-referrer-when-downgrade';
        el.sandbox = 'allow-forms allow-scripts allow-popups allow-top-navigation-by-user-activation allow-same-origin';
        el.style.width = '100%';
        el.style.height = h + 'px';
        el.style.background = 'transparent';
        el.className = (el.className ? el.className + ' ' : '') + 'rounded';
      } else {
        // Use the element as a stable container owned by Elm and only add children.
        try { el.innerHTML = ''; } catch(_) {}
        el.appendChild(iframe);
      }

      var fb = document.getElementById('substack-fallback-link');
      if (fb) { try { fb.remove(); } catch(_) { fb.parentNode && fb.parentNode.removeChild(fb); } }
    }

    var io = ('IntersectionObserver' in window)
      ? new IntersectionObserver(function(entries){
          entries.forEach(function(e){
            if (e.isIntersecting){
              inject(e.target);
              io.unobserve(e.target);
            }
          });
        }, { rootMargin: '200px 0px', threshold: 0.01 })
      : null;

    function setup(){
      document.querySelectorAll(SEL).forEach(function(el){
        if (io) io.observe(el);
      });

      // Safety net: if user never scrolls, load on idle/dwell.
      function idleLoad(){ document.querySelectorAll(SEL).forEach(inject); }
      if ('requestIdleCallback' in window){
        // After ~5s, ask the browser to run idleLoad when it's idle, but no later than 3s after.
        setTimeout(function(){ requestIdleCallback(idleLoad, { timeout: 3000 }); }, 5000);
      } else {
        // Fallback: load after ~8s if user never scrolls
        setTimeout(idleLoad, 8000);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') setup();
    else document.addEventListener('DOMContentLoaded', setup);
  })();
  </script>
