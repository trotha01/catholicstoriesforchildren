  <!-- Manage robots meta tag for saint detail pages -->
  <script>
    function updateRobotsMetaTag() {
      const url = new URL(window.location);
      const isSaintDetailPage = url.pathname === '/saints' && url.searchParams.has('s');
      const existingMetaTag = document.querySelector('meta[name="robots"]');
      
      if (isSaintDetailPage) {
        // Saint detail page - ensure noindex tag exists
        if (!existingMetaTag) {
          const metaTag = document.createElement('meta');
          metaTag.name = 'robots';
          metaTag.content = 'noindex, follow';
          document.head.appendChild(metaTag);
        }
      } else {
        // Not a saint detail page - remove noindex tag if it exists
        if (existingMetaTag) {
          existingMetaTag.remove();
        }
      }
    }
    
    // Update on initial page load
    document.addEventListener('DOMContentLoaded', updateRobotsMetaTag);
    
    // Update on SPA navigation (popstate for back/forward)
    window.addEventListener('popstate', updateRobotsMetaTag);
    
    // Also intercept history.pushState for Elm routing
    const originalPushState = window.history.pushState;
    window.history.pushState = function(...args) {
      originalPushState.apply(this, args);
      // Defer to next tick to allow Elm to finish routing
      Promise.resolve().then(updateRobotsMetaTag);
    };
  </script>

  <!-- Google Analytics consent. Loads immediately for non-EEA visitors; EEA visitors require explicit cookie consent. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };

    // Default: grant all for non-EEA visitors.
    window.gtag('consent', 'default', {
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      ad_storage: 'granted',
      analytics_storage: 'granted',
      functionality_storage: 'granted',
      personalization_storage: 'granted',
      security_storage: 'granted'
    });

    // EEA/GDPR regions: deny by default until the user explicitly consents.
    window.gtag('consent', 'default', {
      region: ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','CH','GB'],
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      ad_storage: 'denied',
      analytics_storage: 'denied',
      functionality_storage: 'granted',
      personalization_storage: 'denied',
      security_storage: 'granted'
    });

    window.loadGoogleTag = function() {
      if (window.__gtagLoaded) return;
      if (window.location.hostname.endsWith('netlify.app')) return;
      window.__gtagLoaded = true;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-6JTEZS9G2D';
      document.head.appendChild(script);
      window.gtag('js', new Date());
      window.gtag('config', 'G-6JTEZS9G2D');
      window.gtag('config', 'AW-XXXXXXXXX');
    };

    // Load immediately — consent defaults handle regional restrictions.
    window.loadGoogleTag();
  </script>

  <!-- Google Ads conversion tracking.
       TODO: replace AW-XXXXXXXXX (above and in send_to below) and the conversion label
       with the real values from Google Ads → Goals → Conversions → conversion action → "Use Google tag". -->
  <script>
    window.gtag_report_conversion = function (url) {
      window.gtag('event', 'conversion', {
        send_to: 'AW-XXXXXXXXX/XXXXXXXXXXX',
        event_callback: function () { if (url) { window.location = url; } }
      });
      return false;
    };

    // The signup form and donate links open in a new tab, so the page
    // survives long enough for the conversion hit to send.
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (form && form.action && form.action.indexOf('blog.claritasstudios.com') !== -1) {
        window.gtag_report_conversion();
      }
    }, true);

    document.addEventListener('click', function (e) {
      var link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (link && /zeffy\.com|kickstarter\.com|cars2charities\.org/.test(link.href)) {
        window.gtag_report_conversion();
      }
    }, true);
  </script>
