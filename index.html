<!DOCTYPE html>
<html>

<head>
  <title>Redirecting…</title>
  <script>
    // Get the current path and query string
    const path = window.location.pathname;
    const search = window.location.search;
    // Build the new URL
    const target = 'https://claritasstudios.com' + path + search;
    // Redirect
    window.location.replace(target);
  </script>
</head>

<body>
  <p>If you're not redirected, <a id="redirect-link" href="#">click here</a>.</p>
  <script>
    // Update the fallback link
    document.getElementById('redirect-link').href = 'https://claritasstudios.com' + window.location.pathname + window.location.search;
  </script>
</body>

</html>
